
# 1. BACKEND API MICROSERVICE LAYER

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aerovibe-backend
  labels:
    app: aerovibe-backend
spec:
  replicas: 2 # Maintain high availability across two pods minimum
  selector:
    matchLabels:
      app: aerovibe-backend
  template:
    metadata:
      labels:
        app: aerovibe-backend
        # Tells Prometheus to automatically discover and scrape this pod
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
    spec:
      containers:
      - name: api-engine
        image: localhost:4566/aerovibe-backend-api:latest # Tied to our Terraform ECR Registry
        ports:
        - containerPort: 5000
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "250m"
            memory: "128Mi"
        # Self-healing readiness checks
        readinessProbe:
          httpGet:
            path: /api/telemetry
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: aerovibe-backend-service
spec:
  selector:
    app: aerovibe-backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP

---

# 2. AUTOMATED SCALING POLICY (HORIZONTAL POD AUTOSCALER)

apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: aerovibe-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aerovibe-backend
  minReplicas: 2
  maxReplicas: 10 # Scale up to 10 pods automatically if mock traffic stress is injected
  targetCPUUtilizationPercentage: 70

---

# 3. PREMIUM FRONTEND UI LAYER

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aerovibe-frontend
  labels:
    app: aerovibe-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aerovibe-frontend
  template:
    metadata:
      labels:
        app: aerovibe-frontend
    spec:
      containers:
      - name: ui-webserver
        image: localhost:4566/aerovibe-frontend-suite:latest # Tied to  Terraform ECR Registry
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "300m"
            memory: "128Mi"
          requests:
            cpu: "150m"
            memory: "64Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: aerovibe-frontend-service
spec:
  selector:
    app: aerovibe-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer 